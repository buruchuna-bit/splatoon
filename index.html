<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スプラ3 武器編成ルーレット</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#171923;color:#fff;text-align:center}h1{font-size:25px;margin-bottom:8px}.subtitle{color:#b9bdcc;font-size:14px}.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:900px;margin:25px auto}.player{background:#292d3e;border-radius:15px;padding:15px 8px;border:2px solid #474d64;min-width:0}.player h2{font-size:14px;margin:0 0 15px;color:#b9bdcc}.weapon{font-size:16px;font-weight:bold;overflow-wrap:anywhere;line-height:1.5}.kit{font-size:12px;color:#b9bdcc;margin-top:5px;line-height:1.5}.role{margin-top:10px;font-size:13px;color:#ffd85c}.stats{font-size:12px;color:#d2d5e2;margin-top:8px;line-height:1.8}button{border:0;border-radius:12px;padding:15px 25px;font-size:17px;font-weight:bold;cursor:pointer}#roll{background:#d9ff43;color:#171923}#roll:active{transform:scale(.97)}#roll:disabled{opacity:.5;cursor:wait}.summary{max-width:650px;margin:18px auto 0;background:#222638;border-radius:12px;padding:12px;color:#e7e9f2;font-size:13px;line-height:1.8}.status{font-size:12px;color:#b9bdcc;margin-top:12px}.note{max-width:700px;margin:25px auto;color:#b9bdcc;font-size:12px;line-height:1.8;text-align:left}.note a{color:#d9ff43}@media(max-width:420px){body{padding:12px}h1{font-size:22px}.team{gap:6px}.player{padding:12px 4px}.weapon{font-size:14px}.kit{font-size:11px}.role{font-size:12px}.stats{font-size:11px}}
</style>
</head>
<body>
<h1>🎮 スプラ3 武器編成ルーレット</h1>
<div class="subtitle">全ブキセットから3人分を抽選！編成バランスも考慮</div>
<div class="team" id="team"><div class="player"><div class="weapon">武器データを読み込み中…</div></div></div>
<button id="roll" disabled>🎲 編成を決める！</button>
<div class="summary" id="summary">武器データを取得しています。</div>
<div class="status" id="status"></div>
<div class="note">
<strong>抽選ルール</strong><br>
・ブキセット単位で抽選（コラボ・カスタム・追加ブキも別扱い）<br>
・3人のブキセットは重複なし<br>
・前衛／中衛／後衛、塗り性能、射程のバランスを点数化し、バランスの良い候補からランダム抽選<br>
・役割と塗り性能は、ブキ種・射程などから作った目安。実際の立ち回りやステージによって変わります。<br><br>
武器データ出典：<a href="https://stat.ink/api-info/weapon3?_lang_=ja-JP" target="_blank" rel="noopener">stat.ink ブキAPI情報</a>。最新データの取得にはインターネット接続が必要です。
</div>
<script>
const API_URL = 'https://stat.ink/api/v3/weapon';
let weapons = [];
const $ = id => document.getElementById(id);

function roleAndStats(item) {
  const type = item.type?.key || '';
  const name = item.name?.ja_JP || '';
  const main = item.main || '';
  const r = Number(item.matching_range) || 12;
  // stat.inkのmatching_rangeを、表示用の5段階の射程に変換
  const range = Math.max(1, Math.min(5, Math.round((r - 7) / 4.2) + 1));
  const frontTypes = ['roller','brush','maneuver','splatana'];
  const backTypes = ['charger','stringer'];
  let role;
  if (backTypes.includes(type) || r >= 22) role = '後衛';
  else if (frontTypes.includes(type) || r <= 11.5) role = '前衛';
  else role = '中衛';

  // 塗り性能の目安。塗りが得意な代表的なメインを高めに設定
  const highPaint = ['wakaba','promodeler_mg','promodeler_rg','promodeler_sai','nzap85','nzap89','bold','bold_neo','pablo','pablo_hue','lact450','lact450_deco','lact450_milk','variable_roller','dynamo_roller','wide_roller','wide_roller_collabo','furuido','furuido_custom','splash_o_matic'];
  const lowPaint = ['liter4k','liter4k_custom','liter4k_scope','liter4k_scope_custom','longblaster','longblaster_custom','explosher','hydra','prime','prime_collabo','prime_frzn'];
  let paint = highPaint.some(k => main.includes(k)) ? 5 : lowPaint.some(k => main.includes(k)) ? 2 : 3;
  if (type === 'shooter' && r <= 13.5 && paint < 4) paint = 4;
  if (type === 'roller' && /ワイド|ヴァリアブル|ダイナモ/.test(name)) paint = 5;
  if (type === 'stringer' && /LACT|フルイド/.test(name)) paint = 5;
  if (type === 'charger' && /R-PEN/.test(name)) paint = 4;
  return { role, paint, range, type, main, name, sub: item.sub?.name?.ja_JP || '', special: item.special?.name?.ja_JP || '', key: item.key };
}

function normalizeData(data) {
  const list = data.filter(item => {
    const name = item.name?.ja_JP || '';
    const key = item.key || '';
    return name && !name.includes('クマサン印') && !key.startsWith('kuma_') && item.type?.key;
  }).map(item => ({...roleAndStats(item)}));
  // APIの重複レコードをキーで除外
  const unique = new Map();
  list.forEach(w => unique.set(w.key, w));
  return [...unique.values()];
}

function score(team) {
  const roles = team.map(w => w.role);
  const paint = team.reduce((sum,w) => sum + w.paint, 0);
  const ranges = team.map(w => w.range);
  const longCount = team.filter(w => w.range >= 4).length;
  const shortCount = team.filter(w => w.range <= 2).length;
  let s = 0;
  if (roles.includes('前衛')) s += 3;
  if (roles.includes('中衛')) s += 2;
  if (roles.includes('後衛')) s += 3;
  if (paint >= 10) s += 4;
  else if (paint >= 8) s += 2;
  if (Math.max(...ranges) - Math.min(...ranges) >= 2) s += 2;
  if (longCount >= 1) s += 2;
  if (shortCount >= 1) s += 1;
  if (roles.filter(r => r === '後衛').length >= 2) s -= 4;
  if (roles.filter(r => r === '前衛').length === 0) s -= 3;
  if (paint <= 6) s -= 4;
  return s;
}

function createTeam() {
  if (weapons.length < 3) return [];
  let bestScore = -Infinity;
  let candidates = [];
  // ランダムな候補を多数試し、上位の編成からランダムに選ぶ
  for (let i = 0; i < 1400; i++) {
    const team = [];
    const used = new Set();
    while (team.length < 3) {
      const w = weapons[Math.floor(Math.random() * weapons.length)];
      if (!used.has(w.key)) { used.add(w.key); team.push(w); }
    }
    const s = score(team);
    if (s > bestScore) { bestScore = s; candidates = [team]; }
    else if (s >= bestScore - 1) candidates.push(team);
  }
  return candidates[Math.floor(Math.random() * candidates.length)];
}

function renderTeam() {
  const team = createTeam();
  if (team.length !== 3) return;
  $('team').innerHTML = team.map((w,i) => `
    <div class="player">
      <h2>プレイヤー ${i+1}</h2>
      <div class="weapon">${escapeHtml(w.name)}</div>
      <div class="kit">${escapeHtml(w.sub)}<br>＋ ${escapeHtml(w.special)}</div>
      <div class="role">${w.role}</div>
      <div class="stats">塗り性能：${'★'.repeat(w.paint)}${'☆'.repeat(5-w.paint)}<br>射程：${'★'.repeat(w.range)}${'☆'.repeat(5-w.range)}</div>
    </div>`).join('');
  const roles = team.map(w=>w.role);
  const paint = team.reduce((s,w)=>s+w.paint,0);
  const minRange = Math.min(...team.map(w=>w.range));
  const maxRange = Math.max(...team.map(w=>w.range));
  $('summary').innerHTML = `編成バランス：前衛 ${roles.filter(r=>r==='前衛').length}人 ／ 中衛 ${roles.filter(r=>r==='中衛').length}人 ／ 後衛 ${roles.filter(r=>r==='後衛').length}人<br>塗り性能合計：${paint}/15　｜　射程幅：${minRange}〜${maxRange}`;
}
function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function init() {
  try {
    const response = await fetch(API_URL, {cache:'no-cache'});
    if (!response.ok) throw new Error('API response ' + response.status);
    const data = await response.json();
    weapons = normalizeData(data);
    if (weapons.length < 100) throw new Error('取得したブキ数が少なすぎます (' + weapons.length + ')');
    $('status').textContent = `武器データ読み込み完了：${weapons.length}ブキセット`;
    $('roll').disabled = false;
    renderTeam();
  } catch (error) {
    $('team').innerHTML = '<div class="player" style="grid-column:1/-1"><div class="weapon">武器データを読み込めなかったよ</div><div class="kit">通信を確認してページを再読み込みしてね。</div></div>';
    $('summary').textContent = 'データ取得に失敗しました。GitHub Pages上で開いて、インターネット接続を確認してください。';
    $('status').textContent = 'エラー：' + error.message;
  }
}
$('roll').addEventListener('click', renderTeam);
init();
</script>
</body>
</html>
