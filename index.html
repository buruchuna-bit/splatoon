<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スプラ3 武器編成ルーレット</title>
<style>
:root{color-scheme:dark;--bg:#171923;--panel:#292d3e;--line:#474d64;--lime:#d9ff43;--muted:#b9bdcc}
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:#fff;text-align:center}
h1{font-size:clamp(21px,4vw,29px);margin:5px 0 8px}.subtitle{color:var(--muted);font-size:14px;line-height:1.6}
.controls{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin:18px auto 8px}
select,button{border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700}
select{background:#292d3e;color:#fff;border:1px solid var(--line)}button{background:var(--lime);color:#171923;cursor:pointer}button:active{transform:scale(.98)}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:1000px;margin:18px auto}
.player{background:var(--panel);border:2px solid var(--line);border-radius:15px;padding:14px 9px;min-width:0}
.player h2{font-size:13px;color:var(--muted);margin:0 0 10px}.weapon-icon{height:86px;display:flex;align-items:center;justify-content:center;font-size:42px;filter:drop-shadow(0 4px 3px #0005)}
.weapon-icon img{width:86px;height:86px;object-fit:contain;display:block}
.weapon{font-size:16px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}.type{font-size:11px;color:var(--muted);margin-top:3px}.kit{font-size:12px;color:#d2d5e2;line-height:1.7;margin-top:8px}.role{display:inline-block;margin-top:9px;padding:4px 9px;border-radius:20px;background:#3b4055;font-size:12px;color:var(--lime)}
.stats{font-size:12px;color:#e0e3ed;margin-top:8px;line-height:1.7}.details{margin-top:10px;text-align:left;border-top:1px solid #474d64;padding-top:9px;font-size:11px;color:#d2d5e2;line-height:1.65}.details b{color:#fff}
.summary{max-width:700px;margin:12px auto;background:#222638;border-radius:12px;padding:12px;color:#e7e9f2;font-size:13px;line-height:1.8}.status{font-size:12px;color:var(--muted);margin-top:10px}
.note{max-width:750px;margin:24px auto;color:var(--muted);font-size:12px;line-height:1.8;text-align:left}
@media(max-width:480px){body{padding:10px}.team{gap:5px}.player{padding:10px 5px}.weapon{font-size:13px}.weapon-icon{height:68px;font-size:34px}.weapon-icon img{width:68px;height:68px}.kit,.stats{font-size:10px}.details{font-size:10px}.player h2{font-size:11px}}
</style>
</head>
<body>
<h1>🎮 スプラ3 武器編成ルーレット</h1>
<div class="subtitle">Notionの武器データを内蔵｜ネット接続やstat.ink APIなしで動作</div>
<div class="controls">
<label for="mode">ルール評価：</label>
<select id="mode"><option value="total">総合評価</option><option value="area">ガチエリア</option><option value="tower">ガチヤグラ</option><option value="rainmaker">ガチホコ</option><option value="clam">ガチアサリ</option></select>
<button id="roll">🎲 編成を決める！</button>
</div>
<div class="team" id="team"></div>
<div class="summary" id="summary">編成を抽選中…</div>
<div class="status" id="status"></div>
<div class="note"><b>抽選ルール</b><br>
・武器データ／評価／ポジションは送ってもらったNotionの160種を使用<br>
・総合評価／各ルール評価は抽選確率に一切使用しない<br>
・武器の重複なしで3つ選出<br>
・後衛2人以上は避ける<br>
・同じ「苦手な仕事」が3人全員に被る編成は避ける（2人までOK）<br>
・武器画像だけstat.inkを参照。画像を取得できない場合はブキ種の絵文字を表示します。</div>

const $ = id => document.getElementById(id);
const iconByType = {'シューター':'🔫','ブラスター':'💥','ローラー':'🖌️','フデ':'🖌️','チャージャー':'🎯','スロッシャー':'🪣','スピナー':'⚙️','マニューバー':'🔫','シェルター':'☂️','ストリンガー':'🏹','ワイパー':'⚔️'};
const statWeaponMap = new Map();
const STAT_API = 'https://stat.ink/api/v3/weapon?full=1';
const STAT_ASSET_BASE = 'https://stat.ink/assets/q2zxrpcauko22fek43iqmmhqm6v3wbmc/hfqndna2';

async function loadStatInkImageMap(){
 try{
  const res = await fetch(STAT_API, {cache:'force-cache'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  for(const x of data){
   const ja=x?.name?.ja_JP, folder=x?.type?.name?.en_US, key=x?.key;
   if(ja&&folder&&key){
    statWeaponMap.set(ja, `${STAT_ASSET_BASE}/${encodeURIComponent(folder)}/${encodeURIComponent(key)}.png`);
   }
  }
  $('status').textContent=`武器データ読み込み完了。stat.ink画像：${statWeaponMap.size}件対応`;
  render();
 }catch(e){
  $('status').textContent='武器データ読み込み完了。stat.ink画像を取得できないため絵文字で表示中。';
 }
}
function weaponVisual(w){
 const fallback=iconByType[w.type]||'🎮';
 const url=statWeaponMap.get(w.name);
 if(!url) return fallback;
 return `<img src="${url}" alt="${esc(w.name)}" loading="eager" referrerpolicy="no-referrer" onerror="this.parentElement.textContent='${fallback}'">`;
}
function positions(w){return [...(w.position||'')].filter(x=>['前','中','後'].includes(x)).map(x=>({'前':'前衛','中':'中衛','後':'後衛'}[x]));}
function roleLabel(w){return positions(w).join('・')||'役割不明';}
function splitJobs(text){
 return String(text||'').split(/[,、\/・]/).map(x=>x.trim()).filter(Boolean);
}
function hasTripleBadOverlap(team){
 const counts={};
 for(const w of team){
  for(const job of new Set(splitJobs(w.bad))){counts[job]=(counts[job]||0)+1;}
 }
 return Object.values(counts).some(n=>n>=3);
}
function createTeam(){
 // 評価値は抽選に一切使わない。全武器を同じ確率で3つ引き、
 // 「後衛が2人以上」と「同じ苦手な仕事が3人全員に被る」場合だけ引き直す。
 for(let i=0;i<5000;i++){
  const team=[];
  const pool=[...weapons];
  while(team.length<3&&pool.length){
   const idx=Math.floor(Math.random()*pool.length);
   team.push(pool.splice(idx,1)[0]);
  }
  if(team.length!==3)continue;
  const back=team.filter(w=>positions(w).includes('後衛')).length;
  if(back>=2)continue;
  if(hasTripleBadOverlap(team))continue;
  return team;
 }
 // 念のためのフォールバック。評価値による選別はしない。
 return [...weapons].sort(()=>Math.random()-.5).slice(0,3);
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function stars(n){const v=Math.max(0,Math.min(10,Number(n)||0));return `${v}/10`;}
function render(){
 const team=createTeam();
 $('team').innerHTML=team.map((w,i)=>`
 <article class="player">
  <h2>プレイヤー ${i+1}</h2>
  <div class="weapon-icon">${weaponVisual(w)}</div>
  <div class="weapon">${esc(w.name)}</div>
  <div class="type">${esc(w.type)}</div>
  <div class="kit">サブ：${esc(w.sub)}<br>スペシャル：${esc(w.special)}</div>
  <div class="role">${esc(roleLabel(w))}</div>
  <div class="stats">射程：${esc(w.range)}　｜　扱いやすさ：${stars(w.easy)}<br>総合評価：${esc(w.total)}/10</div>
  <div class="details"><b>得意：</b>${esc(w.good||'—')}<br><b>苦手：</b>${esc(w.bad||'—')}<br><b>評価：</b>エリア ${esc(w.area)} ／ ヤグラ ${esc(w.tower)} ／ ホコ ${esc(w.rainmaker)} ／ アサリ ${esc(w.clam)}</div>
 </article>`).join('');
 const pos=team.map(positions);
 const f=pos.filter(a=>a.includes('前衛')).length,m=pos.filter(a=>a.includes('中衛')).length,b=pos.filter(a=>a.includes('後衛')).length;
 const modeName=$('mode').selectedOptions[0].textContent;
 const avg=(team.reduce((s,w)=>s+(Number(w[$('mode').value])||0),0)/3).toFixed(2);
 $('summary').innerHTML=`編成バランス：前衛 ${f}人分 ／ 中衛 ${m}人分 ／ 後衛 ${b}人分<br>${esc(modeName)}の平均評価：${avg}　｜　武器データ：${weapons.length}種`;
 if(!statWeaponMap.size)$('status').textContent='武器データ読み込み完了。武器画像をstat.inkから取得中…';
}
$('roll').addEventListener('click',render);
$('mode').addEventListener('change',render);
render();
loadStatInkImageMap();
</script>
